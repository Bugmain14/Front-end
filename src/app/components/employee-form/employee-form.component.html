<!-- src/app/components/employee-form/employee-form.component.html -->
<h2 mat-dialog-title>{{ data ? 'Edit' : 'Create' }} Employee</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="saveEmployee()">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('minlength')">Name must be at least 2 characters long</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
      <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
  </form>
</mat-dialog-content>
